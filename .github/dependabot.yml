version: 2
updates:
  # pnpm workspace dependencies (root manifest covers the monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # 0.0.x SDK，patch 即 breaking（商业运行时依赖），升级需专门验证迁移
    ignore:
      - dependency-name: "@asciidev/box-sdk"

  # Keep GitHub Actions in .github/workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
