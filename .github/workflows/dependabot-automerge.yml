name: dependabot-automerge

# 依赖自动化门禁：dependabot 的 PR 一律设置 auto-merge，
# 只有必需检查（check + dco）全绿才会真正合入；红了自动卡住等人工。
# 批量大改动（如整包 lockfile 漂移）跑不绿就永远停在 PR，不会带坏 main。

on:
  pull_request

permissions:
  contents: read

jobs:
  enable-automerge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        # 必须用 PAT：GITHUB_TOKEN 触发的 automerge,其合并 push 归因
        # 到 github-actions[bot]，不会触发 notify-commercial 等下游 workflow
        env:
          GH_TOKEN: ${{ secrets.WEMUX_CLOUD_DISPATCH_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
