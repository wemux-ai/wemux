name: Electron Desktop Release

# A v* tag builds Electron artifacts for macOS, Windows and Linux, uploads
# electron-updater's latest*.yml files, then publishes one GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            builder_args: --mac dmg zip --arm64 --x64
          - platform: windows
            os: windows-latest
            builder_args: --win nsis --x64
          - platform: linux
            os: ubuntu-latest
            builder_args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install core dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build static renderer
        run: pnpm build:native:web-static

      - name: Build Electron artifacts
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CERTIFICATE || secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CERTIFICATE_PWD || secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.builder_args }} --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          merge-multiple: true
          path: bundles

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate download manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/desktop-release.mjs manifest --version "$VERSION" --bundles-dir bundles --out-dir release-out

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --draft --title "Wemux v${VERSION}" --notes "Wemux Electron desktop v${VERSION}"
          find bundles -type f -print0 | xargs -0 gh release upload "v${VERSION}" --clobber
          gh release upload "v${VERSION}" release-out/downloads.json --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release edit "v${VERSION}" --draft=false --title "Wemux v${VERSION}" --notes-file release-out/notes.txt
