name: Deploy Preview

on:
  push:
    branches:
      - preview
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

  build-image:
    runs-on: ubuntu-latest
    outputs:
      worker_installer_package_version: ${{ steps.prep.outputs.worker_installer_package_version }}
    env:
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-KHSGWBC0DV' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "GHCR login failed after ${attempt} attempts." >&2
              exit 1
            fi

            echo "GHCR login attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 10))
          done

      - name: Prepare Image Metadata
        id: prep
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "sha_short_8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "worker_installer_package_version=${package_version}-preview.${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Preview Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.control-plane
          build-args: |
            INCLUDE_BUNDLED_POSTGRES=false
            WORKER_INSTALLER_CHANNEL=preview
            WORKER_INSTALLER_PACKAGE_VERSION=${{ steps.prep.outputs.worker_installer_package_version }}
            VITE_GA_MEASUREMENT_ID=${{ env.VITE_GA_MEASUREMENT_ID }}
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:preview
            ${{ steps.prep.outputs.image }}:preview-${{ steps.prep.outputs.sha_short }}
          cache-from: type=gha,scope=control-plane-preview
          cache-to: type=gha,scope=control-plane-preview,mode=max
