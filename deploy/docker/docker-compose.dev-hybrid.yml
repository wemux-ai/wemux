name: ${HYBRID_PROJECT_NAME:-wemux}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wemux
      POSTGRES_USER: wemux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wemux -d wemux']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - wemux-hybrid-postgres-data:/var/lib/postgresql/data

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_USER: wemux
      POSTGRES_PREVIEW_DB: wemux_preview
      POSTGRES_PRODUCTION_DB: wemux_production
    entrypoint: >-
      /bin/sh -c
      "psql -h postgres -U vibemux -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'vibemux_preview'\" | grep -q 1 || psql -h postgres -U vibemux -d postgres -c \"CREATE DATABASE \\\"vibemux_preview\\\"\";
      psql -h postgres -U vibemux -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'vibemux_production'\" | grep -q 1 || psql -h postgres -U vibemux -d postgres -c \"CREATE DATABASE \\\"vibemux_production\\\"\""

  server:
    build:
      context: ../..
      dockerfile: Dockerfile.control-plane
      target: deps
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: ${HYBRID_SERVER_PORT:-18989}
      APP_URL: ${APP_URL:-http://127.0.0.1:${HYBRID_SERVER_PORT:-18989}}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:${HYBRID_WEB_PORT:-15173}}
      WEMUX_PUBLIC_BASE_URL: ${WEMUX_PUBLIC_BASE_URL:-http://127.0.0.1:${HYBRID_WEB_PORT:-15173}}
      WEMUX_CLOUD_URL: ${WEMUX_CLOUD_URL:-http://127.0.0.1:${HYBRID_SERVER_PORT:-18989}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:${HYBRID_SERVER_PORT:-18989}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:${HYBRID_WEB_PORT:-15173},http://localhost:${HYBRID_WEB_PORT:-15173},http://127.0.0.1:${HYBRID_SERVER_PORT:-18989},http://localhost:${HYBRID_SERVER_PORT:-18989}}
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-}
      WEMUX_RUNTIME_DIR: /data/vibemux-runtime
      DATABASE_URL: postgres://wemux:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/wemux
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required for hybrid dev}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required for hybrid dev}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required for hybrid dev}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required for hybrid dev}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      WEMUX_WORKER_CONSOLE_URL: http://host.docker.internal:${WEMUX_WORKER_PORT:-48121}
      WEMUX_MESH_ENABLED: ${WEMUX_MESH_ENABLED:-}
      WEMUX_OFFICIAL_CONNECTOR_URL: ${WEMUX_OFFICIAL_CONNECTOR_URL:-}
      WEMUX_OFFICIAL_CONNECTOR_ADMIN_TOKEN: ${WEMUX_OFFICIAL_CONNECTOR_ADMIN_TOKEN:-}
      WEMUX_OFFICIAL_CONNECTOR_RUNTIME_TOKEN: ${WEMUX_OFFICIAL_CONNECTOR_RUNTIME_TOKEN:-}
      WEMUX_FOUNDER_USER_ID: ${WEMUX_FOUNDER_USER_ID:-}
      WEMUX_MANAGED_CLOUD_RUNTIME_PROVIDER: ${WEMUX_MANAGED_CLOUD_RUNTIME_PROVIDER:-}
      WEMUX_MANAGED_CLOUD_URL: ${WEMUX_MANAGED_CLOUD_URL:-}
      WEMUX_MANAGED_CLOUD_CF_SANDBOX_GATEWAY_URL: ${WEMUX_MANAGED_CLOUD_CF_SANDBOX_GATEWAY_URL:-}
      WEMUX_MANAGED_CLOUD_CF_SANDBOX_API_KEY: ${WEMUX_MANAGED_CLOUD_CF_SANDBOX_API_KEY:-}
      WEMUX_MANAGED_CLOUD_CF_SANDBOX_INSTANCE_TYPE: ${WEMUX_MANAGED_CLOUD_CF_SANDBOX_INSTANCE_TYPE:-}
      WEMUX_MANAGED_CLOUD_CF_SANDBOX_KEEP_ALIVE_SECONDS: ${WEMUX_MANAGED_CLOUD_CF_SANDBOX_KEEP_ALIVE_SECONDS:-}
      WEMUX_MANAGED_CLOUD_CF_SANDBOX_MOUNT_DRIVE: ${WEMUX_MANAGED_CLOUD_CF_SANDBOX_MOUNT_DRIVE:-}
      WEMUX_MANAGED_CLOUD_CF_SANDBOX_DRIVE_MOUNT_PATH: ${WEMUX_MANAGED_CLOUD_CF_SANDBOX_DRIVE_MOUNT_PATH:-}
      WEMUX_MANAGED_CLOUD_CF_SANDBOX_BOOTSTRAP_COMMAND: ${WEMUX_MANAGED_CLOUD_CF_SANDBOX_BOOTSTRAP_COMMAND:-}
      WEMUX_MANAGED_CLOUD_IDLE_AUTO_STOP_MINUTES: ${WEMUX_MANAGED_CLOUD_IDLE_AUTO_STOP_MINUTES:-}
      WEMUX_MANAGED_CLOUD_ALLOW_LOCAL_DOCKER: ${WEMUX_MANAGED_CLOUD_ALLOW_LOCAL_DOCKER:-}
      WEMUX_MANAGED_CLOUD_DOCKER_IMAGE: ${WEMUX_MANAGED_CLOUD_DOCKER_IMAGE:-}
      WEMUX_MANAGED_CLOUD_DOCKER_HOST: ${WEMUX_MANAGED_CLOUD_DOCKER_HOST:-}
      WEMUX_MANAGED_CLOUD_DOCKER_CONTEXT: ${WEMUX_MANAGED_CLOUD_DOCKER_CONTEXT:-}
      WEMUX_MANAGED_CLOUD_DOCKER_EGRESS_MODE: ${WEMUX_MANAGED_CLOUD_DOCKER_EGRESS_MODE:-}
      WEMUX_MANAGED_CLOUD_DOCKER_NETWORK: ${WEMUX_MANAGED_CLOUD_DOCKER_NETWORK:-}
      WEMUX_MANAGED_CLOUD_DOCKER_CPUS: ${WEMUX_MANAGED_CLOUD_DOCKER_CPUS:-}
      WEMUX_MANAGED_CLOUD_DOCKER_MEMORY: ${WEMUX_MANAGED_CLOUD_DOCKER_MEMORY:-}
      WEMUX_MANAGED_CLOUD_DOCKER_WORKER_HOME: ${WEMUX_MANAGED_CLOUD_DOCKER_WORKER_HOME:-}
      WEMUX_MANAGED_CLOUD_DOCKER_POOL: ${WEMUX_MANAGED_CLOUD_DOCKER_POOL:-}
      WEMUX_OFFICIAL_CONNECTOR_URL: ${WEMUX_OFFICIAL_CONNECTOR_URL:-}
      WEMUX_OFFICIAL_CONNECTOR_ADMIN_TOKEN: ${WEMUX_OFFICIAL_CONNECTOR_ADMIN_TOKEN:-}
      WEMUX_OFFICIAL_CONNECTOR_RUNTIME_TOKEN: ${WEMUX_OFFICIAL_CONNECTOR_RUNTIME_TOKEN:-}
      WEMUX_EASYTIER_NETWORK_NAME: ${WEMUX_EASYTIER_NETWORK_NAME:-}
      WEMUX_EASYTIER_NETWORK_PREFIX: ${WEMUX_EASYTIER_NETWORK_PREFIX:-}
      WEMUX_EASYTIER_NETWORK_SECRET: ${WEMUX_EASYTIER_NETWORK_SECRET:-}
      WEMUX_EASYTIER_PEERS: ${WEMUX_EASYTIER_PEERS:-}
      WEMUX_EASYTIER_IPV4_PREFIX: ${WEMUX_EASYTIER_IPV4_PREFIX:-}
      WEMUX_EASYTIER_PREVIEW_PROXY_PORT: ${WEMUX_EASYTIER_PREVIEW_PROXY_PORT:-}
      WEMUX_EASYTIER_TERMINAL_PROXY_PORT: ${WEMUX_EASYTIER_TERMINAL_PROXY_PORT:-}
      WEMUX_EASYTIER_SERVER_IPV4: ${WEMUX_EASYTIER_SERVER_IPV4:-}
      WEMUX_EASYTIER_LISTEN_URLS: ${WEMUX_EASYTIER_LISTEN_URLS:-}
    working_dir: /app
    command:
      - /bin/sh
      - -lc
      - node scripts/dev-ensure-deps.mjs /app && pnpm dev:server:docker
    ports:
      - '${HYBRID_BIND_HOST:-127.0.0.1}:${HYBRID_SERVER_PORT:-18989}:${HYBRID_SERVER_PORT:-18989}'
      - '${HYBRID_EASYTIER_BIND_HOST:-0.0.0.0}:${WEMUX_EASYTIER_PUBLIC_PORT:-11010}:11010/tcp'
      - '${HYBRID_EASYTIER_BIND_HOST:-0.0.0.0}:${WEMUX_EASYTIER_PUBLIC_PORT:-11010}:11010/udp'
    volumes:
      - ../..:/app
      - wemux-hybrid-server-node-modules:/app/node_modules
      - wemux-hybrid-server-runtime:/data/wemux-runtime

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.control-plane
      target: deps
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    depends_on:
      - server
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      HOST: 0.0.0.0
      PORT: ${HYBRID_WEB_PORT:-15173}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-127.0.0.1}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:${HYBRID_WEB_PORT:-15173}}
      VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-http://127.0.0.1:${HYBRID_WEB_PORT:-15173}}
      VITE_BETTER_AUTH_URL: ${VITE_BETTER_AUTH_URL:-http://127.0.0.1:${HYBRID_WEB_PORT:-15173}/api/identity}
      VITE_SERVER_PROXY_TARGET: ${VITE_SERVER_PROXY_TARGET:-http://server:${HYBRID_SERVER_PORT:-18989}}
      VITE_DOCS_PROXY_TARGET: ${VITE_DOCS_PROXY_TARGET:-http://host.docker.internal:${HYBRID_DOCS_PORT:-3001}}
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-300}
    working_dir: /app
    command:
      - /bin/sh
      - -lc
      - node scripts/dev-ensure-deps.mjs /app && pnpm dev:client:docker
    ports:
      - '${HYBRID_BIND_HOST:-0.0.0.0}:${HYBRID_WEB_PORT:-15173}:${HYBRID_WEB_PORT:-15173}'
    volumes:
      - ../..:/app
      - wemux-hybrid-web-node-modules:/app/node_modules

volumes:
  wemux-hybrid-postgres-data:
  wemux-hybrid-server-node-modules:
  wemux-hybrid-server-runtime:
  wemux-hybrid-web-node-modules:
