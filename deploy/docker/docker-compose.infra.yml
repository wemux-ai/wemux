services:
  postgres:
    image: postgres:16-alpine
    container_name: wemux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wemux
      POSTGRES_USER: wemux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - '5434:5432'
    volumes:
      - wemux-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wemux -d wemux']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-init:
    image: postgres:16-alpine
    container_name: wemux-postgres-init
    depends_on:
      - postgres
    restart: 'no'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_USER: wemux
      POSTGRES_PREVIEW_DB: wemux_preview
      POSTGRES_PRODUCTION_DB: wemux_production
    entrypoint: >-
      /bin/sh -c
      "until pg_isready -h postgres -U wemux -d wemux; do sleep 2; done;
      psql -h postgres -U wemux -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'wemux_preview'\" | grep -q 1 || psql -h postgres -U wemux -d postgres -c \"CREATE DATABASE \\\"wemux_preview\\\"\";
      psql -h postgres -U wemux -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'wemux_production'\" | grep -q 1 || psql -h postgres -U wemux -d postgres -c \"CREATE DATABASE \\\"wemux_production\\\"\""

  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: wemux-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: wemux
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-local-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_EXTERNAL_ADDRESS: 127.0.0.1:9100
    command: ['/data']
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - wemux-rustfs-data:/data

  rustfs-init:
    # minio/mc 已不再提供匿名拉取，这里用固定版本的 aws-cli 建桶。
    image: amazon/aws-cli:2.38.5
    container_name: wemux-rustfs-init
    depends_on:
      - rustfs
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: wemux
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-local-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >-
      /bin/sh -c
      "until aws --endpoint-url http://rustfs:9000 s3api list-buckets > /dev/null; do sleep 2; done;
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket wemux 2>/dev/null ||
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket wemux"

volumes:
  wemux-postgres-data:
  wemux-rustfs-data:
